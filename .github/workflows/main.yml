name: Build Vanilla Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  assembleVanillaDebug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Build Vanilla Debug
        run: ./gradlew assembleVanillaDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aurora-store-vanilla-debug
          path: app/build/outputs/apk/vanilla/debug/app-vanilla-debug.apk
          if-no-files-found: error
